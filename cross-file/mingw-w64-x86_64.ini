# Meson cross-file for building bmpflash for 64-bit Windows with MinGW-w64.
# The posix threads variant of the compilers is needed for std::thread and std::mutex (used by substrate).
# Everything is linked statically so the result is a single .exe with no DLL dependencies.

[binaries]
c = 'x86_64-w64-mingw32-gcc-posix'
cpp = 'x86_64-w64-mingw32-g++-posix'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
# Never pick up host libraries, always use the subproject fallbacks
pkg-config = 'false'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
c_link_args = ['-static']
cpp_link_args = ['-static']
